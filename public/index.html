<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام الحضور والطلبات — نوى</title>
<style>
  body{font-family:system-ui,"Segoe UI",Tahoma,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#faf6f1;color:#3b2a1e}
  main{max-width:34rem;padding:2rem;text-align:center}
  h1{font-size:1.5rem;margin:0 0 .5rem} p{color:#6b5a4c;line-height:1.7}
  code{background:#fff;border:1px solid #eadfd3;border-radius:6px;padding:.1rem .4rem}
</style>
</head>
<body>
<main>
  <h1>نظام الحضور والطلبات — جمعية نوى</h1>
  <p>الخدمة قيد الإعداد. حالة الخادم: <code id="s">…</code></p>
</main>
<script>
fetch('/api/health').then(r=>r.json()).then(j=>{document.getElementById('s').textContent=j.ok?'يعمل':'متوقف'}).catch(()=>{document.getElementById('s').textContent='غير متاح'});
</script>
</body>
</html>
